service: ggsc-backend

provider:
  name: aws
  runtime: nodejs18.x
  region: ap-south-1  # Mumbai
  stage: dev
  environment:
    JWT_SECRET: ${env:JWT_SECRET, 'ggsc-jwt-super-secret-key-2026'}
    PROFILES_TABLE: ggsc-profiles
    ATTENDANCE_TABLE: ggsc-attendance
    WEBAUTHN_TABLE: ggsc-webauthn
    LOGIN_HISTORY_TABLE: ggsc-login-history
    CLOUDINARY_CLOUD_NAME: ${env:CLOUDINARY_CLOUD_NAME, 'e2qvanrx'}
    CLOUDINARY_API_KEY: ${env:CLOUDINARY_API_KEY, '453893951347733'}
    CLOUDINARY_API_SECRET: ${env:CLOUDINARY_API_SECRET, 'H4U5yHil42FC0Su25JavgKl1eRs'}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - "arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/ggsc-*"

package:
  patterns:
    - '!node_modules/react/**'
    - '!node_modules/react-dom/**'
    - '!node_modules/react-icons/**'
    - '!node_modules/react-router/**'
    - '!node_modules/react-router-dom/**'
    - '!node_modules/react-is/**'
    - '!node_modules/react-refresh/**'
    - '!node_modules/react-universal-interface/**'
    - '!node_modules/react-use/**'
    - '!node_modules/three/**'
    - '!node_modules/gsap/**'
    - '!node_modules/@gsap/**'
    - '!node_modules/framer-motion/**'
    - '!node_modules/motion-dom/**'
    - '!node_modules/motion-utils/**'
    - '!node_modules/lucide-react/**'
    - '!node_modules/xlsx/**'
    - '!node_modules/cfb/**'
    - '!node_modules/codepage/**'
    - '!node_modules/crc-32/**'
    - '!node_modules/adler-32/**'
    - '!node_modules/frac/**'
    - '!node_modules/ssf/**'
    - '!node_modules/wmf/**'
    - '!node_modules/word/**'
    - '!node_modules/html5-qrcode/**'
    - '!node_modules/qrcode/**'
    - '!node_modules/pngjs/**'
    - '!node_modules/dijkstrajs/**'
    - '!node_modules/papaparse/**'
    - '!node_modules/clsx/**'
    - '!node_modules/js-cookie/**'
    - '!node_modules/vite/**'
    - '!node_modules/.vite/**'
    - '!node_modules/.bin/**'
    - '!node_modules/@vitejs/**'
    - '!node_modules/@rollup/**'
    - '!node_modules/@rolldown/**'
    - '!node_modules/@esbuild/**'
    - '!node_modules/esbuild/**'
    - '!node_modules/@babel/**'
    - '!node_modules/@jridgewell/**'
    - '!node_modules/tailwindcss/**'
    - '!node_modules/tailwind-api-utils/**'
    - '!node_modules/autoprefixer/**'
    - '!node_modules/postcss*/**'
    - '!node_modules/sucrase/**'
    - '!node_modules/jiti/**'
    - '!node_modules/eslint*/**'
    - '!node_modules/@eslint*/**'
    - '!node_modules/@humanfs/**'
    - '!node_modules/@humanwhocodes/**'
    - '!node_modules/prettier/**'
    - '!node_modules/@pkgr/**'
    - '!node_modules/@supabase/**'
    - '!node_modules/@types/**'
    - '!node_modules/@nodelib/**'
    - '!node_modules/@xobotyi/**'

functions:
  api:
    handler: api/lambda.handler
    events:
      - httpApi: '*'
